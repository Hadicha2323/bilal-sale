<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fon -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a7edf;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Yumaloqlangan kvadrat fon -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGradient)"/>
  
  <!-- Oq doira -->
  <circle cx="256" cy="256" r="180" fill="white" opacity="0.12"/>
  
  <!-- "B" harfi -->
  <text x="256" y="360" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="320" 
        font-weight="900" 
        fill="white" 
        text-anchor="middle"
        filter="url(#shadow)">B</text>
  
  <!-- Pastdagi kichik chiziq (dizayn elementi) -->
  <rect x="180" y="420" width="152" height="10" rx="5" fill="white" opacity="0.5"/>
</svg>